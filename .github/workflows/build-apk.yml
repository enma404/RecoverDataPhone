# ============================================================
# GitHub Actions - Build Android APK
# ============================================================
# يبني APK تلقائياً عند:
#   - push إلى main / develop
#   - pull request إلى main
#   - يدوياً (workflow_dispatch)
#
# الناتج: APK قابل للتحميل من "Actions" → "Artifacts"
# ============================================================

name: Build APK

# ------------------------------------------------------------
# متى يعمل الـ workflow
# ------------------------------------------------------------
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
  workflow_dispatch:      # ← تشغيل يدوي من GitHub UI

# ------------------------------------------------------------
# الصلاحيات
# ------------------------------------------------------------
permissions:
  contents: read

# ------------------------------------------------------------
# منع تشغيل نسخ متعددة في نفس الوقت
# ------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ------------------------------------------------------------
# المهام
# ------------------------------------------------------------
jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    # مهلة كاملة
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android-app

    steps:
      # ============================================================
      # 1. جلب الكود
      # ============================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. إعداد JDK 17
      # ============================================================
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ============================================================
      # 3. إعداد Android SDK
      # ============================================================
      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      # ============================================================
      # 4. إعطاء صلاحية التنفيذ لـ gradlew
      # ============================================================
      - name: 🔧 Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # ============================================================
      # 5. إنشاء local.properties
      # ============================================================
      - name: 📝 Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > ./local.properties

      # ============================================================
      # 6. طباعة معلومات البناء
      # ============================================================
      - name: ℹ️ Print build info
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "  RecoverDataPhone - Build Info"
          echo "════════════════════════════════════════════════════════"
          echo "  Gradle version :"
          ./gradlew --version
          echo "════════════════════════════════════════════════════════"

      # ============================================================
      # 7. تنظيف
      # ============================================================
      - name: 🧹 Clean
        run: ./gradlew clean

      # ============================================================
      # 8. بناء Debug APK
      # ============================================================
      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ============================================================
      # 9. بناء Release APK (اختياري - يحتاج keystore)
      # ============================================================
      # إذا كان keystore.properties موجوداً في GitHub Secrets،
      # يمكن تفعيل هذا القسم.
      #
      # - name: 🔐 Decode Keystore
      #   if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      #   run: |
      #     echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
      #
      # - name: 🔨 Build Release APK
      #   if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      #   run: ./gradlew assembleRelease --stacktrace

      # ============================================================
      # 10. رفع Debug APK كـ Artifact
      # ============================================================
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 11. رفع تقرير Lint (اختياري)
      # ============================================================
      - name: 📤 Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: android-app/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # 12. عرض ملخص
      # ============================================================
      - name: 📊 Build Summary
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "  ✅ Build Complete"
          echo "════════════════════════════════════════════════════════"
          echo "  APK artifacts are available in the Actions tab."
          echo "  Download from: Actions → Build APK → Artifacts"
          echo "════════════════════════════════════════════════════════"
