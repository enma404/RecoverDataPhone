# =====================================================================
# gradle.properties
# الموقع: android-app/gradle.properties
# الدور: إعدادات Gradle العامة + إعدادات Android + الذاكرة
# =====================================================================

# =====================================================================
# 1. إعدادات JVM (ذاكرة Gradle Daemon)
# =====================================================================
# الذاكرة المخصصة لـ Gradle Daemon
# -Xmx2048m مناسبة لمشروع صغير-متوسط
# إذا واجهت بطء أو OutOfMemory، ارفعها إلى 4096m
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# استخدام Gradle Daemon (يُسرّع البناء المتكرر)
org.gradle.daemon=true

# تفعيل البناء المتوازي (يسرّع عند وجود وحدات متعددة)
org.gradle.parallel=true

# تفعيل التخزين المؤقت للبناء (Gradle Build Cache)
org.gradle.caching=true

# تفعيل التكوين عند الطلب (يُسرّع Android Studio)
org.gradle.configureondemand=true

# =====================================================================
# 2. إعدادات Android الأساسية (إلزامية!)
# =====================================================================
# استخدام AndroidX بدل Support Library القديمة (مطلوب لكل مشروع حديث)
android.useAndroidX=true

# ترحيل تلقائي لمكتبات الطرف الثالث إلى AndroidX
android.enableJetifier=true

# =====================================================================
# 3. إعدادات Kotlin (احتياطي - لو أُضيف لاحقاً)
# =====================================================================
# نمط ترميز Kotlin الرسمي
kotlin.code.style=official

# =====================================================================
# 4. إعدادات R8 / ProGuard
# =====================================================================
# تفعيل R8 الكامل (مهم لـ release build)
android.enableR8.fullMode=true

# =====================================================================
# 5. إعدادات الأداء (اختيارية لكن مفيدة)
# =====================================================================
# منع Gradle من توليد ملفات build عند عدم الحاجة
android.nonTransitiveRClass=true

# تحسين تجميع الموارد (Resources)
android.nonFinalResIds=false

# تفعيل التحقق من تعارضات الحزم (يساعد في كشف المشاكل مبكراً)
android.dependencyResolutionManagement.enableConflictResolution=true

# =====================================================================
# 6. إعدادات Nullability (لاستخدام @Nullable و @NonNull)
# =====================================================================
android.enableJetifier=true

# =====================================================================
# 7. إعدادات اختيارية - يمكن تفعيلها لاحقاً
# =====================================================================
# رفع حجم كومة JVM عند البناء Release
# org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# لتسريع بناء المشاريع الكبيرة جداً
# org.gradle.vfs.watch=true

# لتفعيل التتبع الكامل (slow لكن مفيد للتشخيص)
# org.gradle.debug=false