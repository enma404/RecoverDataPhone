plugins {
    id 'com.android.application'
}

android {
    namespace 'com.recoverdata.phone'
    compileSdk 34

    defaultConfig {
        applicationId "com.recoverdata.phone"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // ============================================================
        // عنوان السيرفر الافتراضي
        // ============================================================
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"ws://192.1**.0.0:8765\""
        buildConfigField "int",    "SERVER_PORT",        "8765"

        // ============================================================
        // معلومات المشروع
        // ============================================================
        buildConfigField "String", "CLIENT_VERSION", "\"1.0.0\""
        buildConfigField "String", "CLIENT_NAME",    "\"RecoverDataPhone\""
    }

    // ================================================================
    // ✅ لا يوجد signingConfigs هنا
    // AGP يستخدم debug.keystore تلقائياً (يُنشئه إن لم يوجد)
    // ================================================================

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"

            buildConfigField "String", "DEFAULT_SERVER_URL", "\"ws://192.1**.0.0:8765\""
            buildConfigField "int",    "SERVER_PORT",        "8765"
            buildConfigField "boolean", "VERBOSE_LOG", "true"
        }

        release {
            minifyEnabled true
            shrinkResources true
            debuggable false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            buildConfigField "String", "DEFAULT_SERVER_URL", "\"wss://api.recoverdata.com:8765\""
            buildConfigField "int",    "SERVER_PORT",        "8765"
            buildConfigField "boolean", "VERBOSE_LOG", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    packaging {
        resources {
            excludes += [
                    '/META-INF/{AL2.0,LGPL2.1}',
                    '/META-INF/DEPENDENCIES',
                    '/META-INF/LICENSE',
                    '/META-INF/LICENSE.txt',
                    '/META-INF/NOTICE',
                    '/META-INF/NOTICE.txt',
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation'
    }
}

dependencies {
    // ===== Android الأساسية =====
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ===== WebSocket (OkHttp) =====
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ===== JSON =====
    implementation 'com.google.code.gson:gson:2.10.1'

    // ===== Lifecycle =====
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
}
