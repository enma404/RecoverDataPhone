plugins {
    id 'com.android.application'
}

android {
    namespace 'com.recoverdata.phone'
    compileSdk 34

    defaultConfig {
        applicationId "com.recoverdata.phone"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // ============================================================
        // عنوان السيرفر الافتراضي (يُستخدم عند أول تشغيل فقط)
        // بعد أول اتصال ناجح، يُحفظ في SharedPreferences
        // ============================================================
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"ws://192.168.1.2:8765\""
        buildConfigField "int",    "SERVER_PORT",        "8765"

        // ============================================================
        // معلومات المشروع
        // ============================================================
        buildConfigField "String", "CLIENT_VERSION", "\"1.0.0\""
        buildConfigField "String", "CLIENT_NAME",    "\"RecoverDataPhone\""

        // ============================================================
        // تحديد ABI المطلوبة (لتقليل حجم APK)
        // ============================================================
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    // ================================================================
    // Signing Configs (للتوقيع عند النشر)
    // ================================================================
    signingConfigs {
        debug {
            // الافتراضي من Android SDK
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            // ⚠️ أنشئ keystore خاص بك قبل النشر
            // keytool -genkey -v -keystore recoverdata.jks -keyalg RSA \
            //         -keysize 2048 -validity 10000 -alias recoverdata
            //
            // ثم أنشئ ملف `keystore.properties` في android-app/:
            //   RELEASE_STORE_FILE=recoverdata.jks
            //   RELEASE_STORE_PASSWORD=***
            //   RELEASE_KEY_ALIAS=recoverdata
            //   RELEASE_KEY_PASSWORD=***
            //
            // وأضف keystore.properties إلى .gitignore

            def keystorePropsFile = rootProject.file("keystore.properties")
            if (keystorePropsFile.exists()) {
                def keystoreProps = new Properties()
                keystoreProps.load(new FileInputStream(keystorePropsFile))

                storeFile file(keystoreProps['RELEASE_STORE_FILE'])
                storePassword keystoreProps['RELEASE_STORE_PASSWORD']
                keyAlias keystoreProps['RELEASE_KEY_ALIAS']
                keyPassword keystoreProps['RELEASE_KEY_PASSWORD']
            }
            // إذا لم يوجد الملف، سيُبنى release بدون توقيع
            // (لن يُثبّت على الجهاز حتى تضيف التوقيع)
        }
    }

    // ================================================================
    // Build Types
    // ================================================================
    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix ".debug"      // ← يسمح بتثبيت debug + release
            versionNameSuffix "-debug"
            signingConfig signingConfigs.debug

            // عنوان السيرفر للتجربة (Local Network)
            buildConfigField "String", "DEFAULT_SERVER_URL", "\"ws://192.168.1.2:8765\""
            buildConfigField "int",    "SERVER_PORT",        "8765"

            // تفعيل اللوج المفصل للتطوير
            buildConfigField "boolean", "VERBOSE_LOG", "true"
        }

        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            signingConfig signingConfigs.release

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            // ============================================================
            // ⚠️ غيّر هذا إلى عنوان الإنتاج قبل النشر التجاري
            // ============================================================
            buildConfigField "String", "DEFAULT_SERVER_URL", "\"wss://api.recoverdata.com:8765\""
            buildConfigField "int",    "SERVER_PORT",        "8765"

            // إيقاف اللوج المفصل في الإنتاج
            buildConfigField "boolean", "VERBOSE_LOG", "false"

            // تفعيل R8 الكامل (ضغط أقوى)
            // (مفعّل تلقائياً عبر minifyEnabled)
        }

        // ============================================================
        // نوع إضافي: staging (للتجربة قبل الإنتاج)
        // ============================================================
        staging {
            initWith release
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            matchingFallbacks = ['release', 'debug']

            buildConfigField "String", "DEFAULT_SERVER_URL", "\"wss://staging.recoverdata.com:8765\""
            buildConfigField "boolean", "VERBOSE_LOG", "true"
        }
    }

    // ================================================================
    // تقسيم APK حسب ABI (يقلل الحجم بـ ~50%)
    // ================================================================
    splits {
        abi {
            enable false   // ← فعّلها إذا أردت APK منفصل لكل معمارية
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true  // ← APK واحد يحتوي كل المعماريات
        }
    }

    // ================================================================
    // Bundle (AAB) - للنشر على Google Play
    // ================================================================
    bundle {
        language {
            enableSplit = false   // ← ادمج كل اللغات في bundle واحد
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    // ================================================================
    // Compile Options
    // ================================================================
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ================================================================
    // Build Features
    // ================================================================
    buildFeatures {
        buildConfig true   // ← مهم لتفعيل BuildConfig fields
        viewBinding true   // ← مفيد لـ MainActivity لاحقاً
    }

    // ================================================================
    // Packaging (لتجنب تعارضات)
    // ================================================================
    packaging {
        resources {
            excludes += [
                    '/META-INF/{AL2.0,LGPL2.1}',
                    '/META-INF/DEPENDENCIES',
                    '/META-INF/LICENSE',
                    '/META-INF/LICENSE.txt',
                    '/META-INF/NOTICE',
                    '/META-INF/NOTICE.txt',
            ]
        }
    }

    // ================================================================
    // Lint
    // ================================================================
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation'   // ← لا نُفشل البناء بسبب ترجمة ناقصة
        disable 'GoogleAppIndexingWarning'
    }

    // ================================================================
    // Test Options
    // ================================================================
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// ================================================================
// التبعيات (Dependencies)
// ================================================================
dependencies {
    // ===== Android الأساسية =====
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ===== WebSocket (OkHttp) =====
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ===== JSON =====
    implementation 'com.google.code.gson:gson:2.10.1'

    // ===== دعم Lifecycle للخدمات =====
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'

    // ===== دعم Foreground Service =====
    implementation 'androidx.work:work-runtime:2.9.0'

    // ===== Test =====
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// ================================================================
// طباعة معلومات البناء
// ================================================================
tasks.register('printBuildInfo') {
    doLast {
        println "════════════════════════════════════════════════════════════"
        println "  RecoverDataPhone - Build Info"
        println "════════════════════════════════════════════════════════════"
        println "  Application ID : ${android.defaultConfig.applicationId}"
        println "  Version        : ${android.defaultConfig.versionName} (${android.defaultConfig.versionCode})"
        println "  Min SDK        : ${android.defaultConfig.minSdk}"
        println "  Target SDK     : ${android.defaultConfig.targetSdk}"
        println "  Compile SDK    : ${android.compileSdk}"
        println "════════════════════════════════════════════════════════════"
    }
}

// اجعل printBuildInfo يعمل قبل كل بناء
preBuild.dependsOn printBuildInfo