// =====================================================================
// settings.gradle
// الموقع: android-app/settings.gradle
// الدور: تعريف المشروع + الوحدات + مستودعات الإضافات
// =====================================================================

// =====================================================================
// 1. تحديد مستودعات الإضافات (Plugin Repositories)
// =====================================================================
// مهم جداً في Gradle 7+ : يجب أن يُعلن قبل أي شيء آخر
pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// =====================================================================
// 2. مستودعات التبعيات (Dependency Repositories)
// =====================================================================
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// =====================================================================
// 3. اسم المشروع
// =====================================================================
rootProject.name = "RecoverDataPhone"

// =====================================================================
// 4. الوحدات (Modules)
// =====================================================================
// حالياً وحدة واحدة فقط: app
// إذا أضفنا لاحقاً وحدات مثل "library" أو "server-client"، تُضاف هنا
include ':app'